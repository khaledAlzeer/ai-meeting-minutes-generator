[project]
name = "ai-meeting-minutes"
version = "1.0.0"
description = "AI Meeting Minutes Generator: transcribe meeting audio with Whisper and draft professional minutes with Llama 3.2."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Your Name" }
]
keywords = ["ai", "whisper", "llama", "gradio", "transformers", "meeting-minutes", "transcription", "llm"]

dependencies = [
    "torch>=2.2.0",
    "transformers==4.57.6",
    "accelerate>=0.30.0",
    "bitsandbytes>=0.43.0",
    "gradio==5.50.0",
    "huggingface_hub>=0.24.0",
    "python-dotenv>=1.0.1",
    "numpy>=1.26.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/your-username/ai-meeting-minutes"
Repository = "https://github.com/your-username/ai-meeting-minutes"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }